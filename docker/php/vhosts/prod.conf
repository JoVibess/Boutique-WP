<VirtualHost *:80>
    ServerName boutique-test.joeydecroix.com

    DocumentRoot /var/www
    DirectoryIndex index.php

    <Directory /var/www>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/wordpress_error.log
    CustomLog ${APACHE_LOG_DIR}/wordpress_access.log combined
</VirtualHost>
